<!doctype html>
<html lang="en">
  <head>
    <title>Bean There Cafe</title>
    <link rel="stylesheet" href="index.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <nav class="navbar-main">
        <div class="navbar-main-logo">
          <a href="#hero">
            <img src="images/logo.png" alt="Bean There Cafe Logo" />
          </a>
        </div>

        <div class="navbar-main-links">
          <a href="#hero">
            <span class="text-link-primary">HOME</span>
          </a>
          <a>
            <span class="text-link-primary">ABOUT</span>
          </a>
          <a>
            <span class="text-link-primary">MENU</span>
          </a>
          <a>
            <span class="text-link-primary">CONTACT</span>
          </a>
          <button class="navbar-order-now-button">ORDER ONLINE</button>
        </div>
      </nav>
    </header>

    <main>
      <section id="hero" class="hero-section">
        <h1 class="hero-section-slogan">
          Slow Mornings, <br />
          Made Fresh Daily
        </h1>
        <p class="hero-section-desc">
          Small-batch coffee, roasted in-house and served with care. <br />
          Come for the cup, stay for the calm
        </p>
        <button class="hero-section-button">View Our Menu</button>
      </section>
    </main>
  </body>
</html>
